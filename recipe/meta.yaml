{% set name = "fastdownload" %}
{% set version = "0.0.8" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/fastdownload-{{ version }}.tar.gz
  sha256: 7ae6176e2e397de8a25764d4be1b304c9bbe815e7cd9ff36856f7cba9874b3f7

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
  run:
    - python >={{ python_min }}
    - fastprogress
    - fastcore >=1.3.26

test:
  imports:
    - fastdownload
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/fastai/fastdownload/tree/master/
  summary: A general purpose data downloading library.
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - giswqs
